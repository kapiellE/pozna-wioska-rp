
<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CITY WATCH RP — Multiplayer</title>
<script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>
<style>
body{margin:0;background:#111827;color:white;font-family:Arial,sans-serif}
header{padding:15px;background:#172554;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
main{padding:16px;max-width:900px;margin:auto}
#map{height:400px;position:relative;overflow:hidden;background-color:#374151;background-image:linear-gradient(#64748b 2px,transparent 2px),linear-gradient(90deg,#64748b 2px,transparent 2px);background-size:80px 80px;border:2px solid #60a5fa;border-radius:10px}
.player{position:absolute;transform:translate(-50%,-50%);text-align:center;font-size:12px;white-space:nowrap}
.dot{width:18px;height:18px;border-radius:50%;background:#38bdf8;border:2px solid white;margin:auto}
#controls,form{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
button,input{padding:10px;border-radius:7px;border:0}
button{background:#2563eb;color:white;cursor:pointer}
#messages{height:120px;overflow:auto;background:#1f2937;padding:10px;margin-top:12px}
</style>
</head>
<body>
<header>
<strong>CITY WATCH RP</strong>
<span id="status">Łączenie z serwerem…</span>
</header>
<main>
<h2>Mapa miasta</h2>
<p>Używaj klawiszy WASD lub strzałek, aby się poruszać.</p>
<div id="map"></div>
<div id="controls">
<button id="up">▲</button>
<button id="left">◀</button>
<button id="down">▼</button>
<button id="right">▶</button>
</div>
<h3>Czat graczy</h3>
<div id="messages"></div>
<form id="chat">
<input id="message" placeholder="Napisz wiadomość…" maxlength="250" required>
<button>Wyślij</button>
</form>
</main>
<script>
const socket = io();
const map = document.getElementById("map");
const statusText = document.getElementById("status");
const messages = document.getElementById("messages");
const nodes = {};
let myId = null;
let x = 100, y = 100;
let players = {};

const name = (prompt("Podaj nick:", "Gracz") || "Gracz").slice(0,20);
socket.on("connect", () => {
  myId = socket.id;
  statusText.textContent = "Połączono";
  socket.emit("set_name", {name});
});
socket.on("disconnect", () => statusText.textContent = "Rozłączono");
socket.on("players_update", list => {
  players = {};
  list.forEach(p => players[p.id] = p);
  render();
});
socket.on("player_moved", p => {
  players[p.id] = p;
  render();
});
function render() {
  Object.values(players).forEach(p => {
    if (!nodes[p.id]) {
      const el = document.createElement("div");
      el.className = "player";
      const dot = document.createElement("div");
      dot.className = "dot";
      const label = document.createElement("div");
      el.append(dot,label);
      map.appendChild(el);
      nodes[p.id] = {el,label};
    }
    nodes[p.id].label.textContent = p.name + (p.id === myId ? " (Ty)" : "");
    nodes[p.id].el.style.left = (p.x/2000*100) + "%";
    nodes[p.id].el.style.top = (p.y/2000*100) + "%";
  });
  Object.keys(nodes).forEach(id => {
    if (!players[id]) {
      nodes[id].el.remove();
      delete nodes[id];
    }
  });
}
function move(dx,dy) {
  x = Math.max(0,Math.min(2000,x+dx));
  y = Math.max(0,Math.min(2000,y+dy));
  socket.emit("move",{x,y});
  if (myId) {
    players[myId] = {id:myId,name,x,y};
    render();
  }
}
document.addEventListener("keydown", e => {
  const k=e.key.toLowerCase();
  if(["arrowup","arrowdown","arrowleft","arrowright","w","a","s","d"].includes(k)) e.preventDefault();
  if(k==="arrowup"||k==="w") move(0,-20);
  if(k==="arrowdown"||k==="s") move(0,20);
  if(k==="arrowleft"||k==="a") move(-20,0);
  if(k==="arrowright"||k==="d") move(20,0);
});
document.getElementById("up").onclick=()=>move(0,-20);
document.getElementById("down").onclick=()=>move(0,20);
document.getElementById("left").onclick=()=>move(-20,0);
document.getElementById("right").onclick=()=>move(20,0);
document.getElementById("chat").addEventListener("submit",e=>{
  e.preventDefault();
  const input=document.getElementById("message");
  if(input.value.trim()) socket.emit("chat_message",{message:input.value.trim()});
  input.value="";
});
socket.on("chat_message", data=>{
  const line=document.createElement("div");
  line.textContent=data.name+": "+data.message;
  messages.appendChild(line);
  messages.scrollTop=messages.scrollHeight;
});
</script>
</body>
</html>
